name: Build iOS Project
description: Build the caller's iOS project for the simulator without code signing

inputs:
  project_name:
    description: Project name without the .xcodeproj extension.
    required: true
  scheme:
    description: Xcode scheme to build.
    required: true

runs:
  using: composite

  steps:
    - name: Build iOS Project
      shell: bash
      env:
        PROJECT_NAME: ${{ inputs.project_name }}
        SCHEME: ${{ inputs.scheme }}
      run: |
        set -euo pipefail

        if [[ -z "$PROJECT_NAME" ]]; then
          echo "::error::project_name is required."
          exit 1
        fi

        if [[ -z "$SCHEME" ]]; then
          echo "::error::scheme is required."
          exit 1
        fi

        project_path="${PROJECT_NAME}.xcodeproj"

        if [[ ! -d "$project_path" ]]; then
          echo "::error::Xcode project not found: $project_path"
          exit 1
        fi

        mise exec -- xcodebuild \
          -project "$project_path" \
          -scheme "$SCHEME" \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath builds/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY= \
          build

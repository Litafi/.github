name: Detect Version Bump
description: Detect and validate a repository-root VERSION change across a main update

inputs:
  previous-ref:
    description: Git ref or SHA identifying main before the update.
    required: true
  current-ref:
    description: Git ref or SHA identifying main after the update.
    required: true

outputs:
  version_changed:
    description: Whether VERSION changed between the two commits.
    value: ${{ steps.detect.outputs.version_changed }}
  previous_version:
    description: Previous X.Y.Z version when VERSION changed.
    value: ${{ steps.detect.outputs.previous_version }}
  version:
    description: Validated new X.Y.Z version when VERSION changed.
    value: ${{ steps.detect.outputs.version }}

runs:
  using: composite

  steps:
    - name: Detect and Validate VERSION Change
      id: detect
      shell: bash
      env:
        PREVIOUS_REF: ${{ inputs.previous-ref }}
        CURRENT_REF: ${{ inputs.current-ref }}
        DETECT_VERSION_BUMP: ${{ github.action_path }}/../../../../scripts/version-bump/detect
      run: |
        set -euo pipefail

        output="$(
          "${DETECT_VERSION_BUMP}" \
            --previous-ref "${PREVIOUS_REF}" \
            --current-ref "${CURRENT_REF}"
        )"

        printf '%s\n' "${output}"

        version_changed="$(
          printf '%s\n' "${output}" |
            sed -n 's/^version_changed=//p' |
            tail -n 1
        )"

        case "${version_changed}" in
          false)
            printf 'version_changed=false\n' >> "${GITHUB_OUTPUT}"
            ;;
          true)
            previous_version="$(
              printf '%s\n' "${output}" |
                sed -n 's/^previous_version=//p' |
                tail -n 1
            )"
            version="$(
              printf '%s\n' "${output}" |
                sed -n 's/^version=//p' |
                tail -n 1
            )"

            [[ "${previous_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Version-bump detection did not return a valid previous_version." >&2
              exit 1
            }
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Version-bump detection did not return a valid version." >&2
              exit 1
            }

            printf 'version_changed=true\n' >> "${GITHUB_OUTPUT}"
            printf 'previous_version=%s\n' "${previous_version}" >> "${GITHUB_OUTPUT}"
            printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
            ;;
          *)
            echo "Version-bump detection did not return version_changed=true|false." >&2
            exit 1
            ;;
        esac

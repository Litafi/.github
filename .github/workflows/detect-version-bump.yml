name: Detect Version Bump

on:
  workflow_call:
    inputs:
      previous_sha:
        description: Exact main commit SHA before the push.
        required: true
        type: string
      current_sha:
        description: Exact main commit SHA after the push.
        required: true
        type: string
    outputs:
      version_changed:
        description: Whether the repository-root VERSION file changed.
        value: ${{ jobs.detect-version-bump.outputs.version_changed }}
      previous_version:
        description: Previous X.Y.Z version when VERSION changed.
        value: ${{ jobs.detect-version-bump.outputs.previous_version }}
      version:
        description: Validated new X.Y.Z version when VERSION changed.
        value: ${{ jobs.detect-version-bump.outputs.version }}

permissions:
  contents: read

jobs:
  detect-version-bump:
    name: Detect Version Bump
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
      previous_version: ${{ steps.detect.outputs.previous_version }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Require Main Push
        shell: bash
        env:
          CURRENT_SHA: ${{ inputs.current_sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "::error::Detect Version Bump must be called from a push event."
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Detect Version Bump must be called from a push to refs/heads/main."
            exit 1
          fi

          if [[ "${CURRENT_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::current_sha must equal the exact main push SHA."
            exit 1
          fi

      - name: Check Out Current Main History
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.current_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect and Validate Version Bump
        id: detect
        uses: Litafi/.github/.github/actions/version-bump/detect@main
        with:
          previous-ref: ${{ inputs.previous_sha }}
          current-ref: ${{ inputs.current_sha }}

      - name: No Version Bump
        if: ${{ steps.detect.outputs.version_changed == 'false' }}
        run: echo "VERSION unchanged; no version-bump action is required."

      - name: Valid Version Bump
        if: ${{ steps.detect.outputs.version_changed == 'true' }}
        env:
          PREVIOUS_VERSION: ${{ steps.detect.outputs.previous_version }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: echo "Validated VERSION bump ${PREVIOUS_VERSION} -> ${VERSION}."

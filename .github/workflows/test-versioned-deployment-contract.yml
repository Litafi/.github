name: Test Versioned Deployment Contract

on:
  pull_request:
    paths:
      - ".github/properties/**"
      - ".github/rulesets/ios-project.json"
      - ".github/workflows/test-versioned-deployment-contract.yml"
      - "tests/versioned-deployment-contract/**"
  push:
    branches:
      - main
    paths:
      - ".github/properties/**"
      - ".github/rulesets/ios-project.json"
      - ".github/workflows/test-versioned-deployment-contract.yml"
      - "tests/versioned-deployment-contract/**"

permissions:
  contents: read

jobs:
  test-versioned-deployment-contract:
    name: Test Versioned Deployment Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Litafi/.github
        uses: actions/checkout@v5

      - name: Run Versioned Deployment Contract Tests
        run: ./tests/versioned-deployment-contract/run

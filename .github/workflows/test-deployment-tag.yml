name: Test Deployment Tag

on:
  pull_request:
    paths:
      - ".github/actions/deployment-tag/**"
      - ".github/rulesets/deployment-tag/**"
      - ".github/workflows/create-deployment-tag.yml"
      - ".github/workflows/test-deployment-tag.yml"
      - "scripts/deployment-tag/**"
      - "tests/deployment-tag/**"
  push:
    branches:
      - main
    paths:
      - ".github/actions/deployment-tag/**"
      - ".github/rulesets/deployment-tag/**"
      - ".github/workflows/create-deployment-tag.yml"
      - ".github/workflows/test-deployment-tag.yml"
      - "scripts/deployment-tag/**"
      - "tests/deployment-tag/**"

permissions:
  contents: read

jobs:
  test-deployment-tag:
    name: Test Deployment Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Litafi/.github
        uses: actions/checkout@v5

      - name: Run Deployment Tag Tests
        run: ./tests/deployment-tag/run

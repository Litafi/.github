name: Create Deployment Tag

on:
  workflow_call:
    inputs:
      version:
        description: Deployment version in X.Y.Z format.
        required: true
        type: string
      app_client_id:
        description: Client ID of the Litafi Deployment Tagger GitHub App.
        required: true
        type: string
    secrets:
      app_private_key:
        description: PEM private key of the Litafi Deployment Tagger GitHub App.
        required: true
    outputs:
      deployment_tag:
        description: Created immutable deployment tag.
        value: ${{ jobs.create-deployment-tag.outputs.deployment_tag }}
      deployment_commit_sha:
        description: Current main commit identified by the deployment tag.
        value: ${{ jobs.create-deployment-tag.outputs.deployment_commit_sha }}
      app_version:
        description: Application version derived from the deployment tag.
        value: ${{ jobs.create-deployment-tag.outputs.app_version }}
      tag_object_sha:
        description: Git object SHA of the created annotated tag.
        value: ${{ jobs.create-deployment-tag.outputs.tag_object_sha }}

permissions: {}

concurrency:
  group: deployment-tag-creation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-deployment-tag:
    name: Create Deployment Tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      deployment_tag: ${{ steps.create.outputs.deployment_tag }}
      deployment_commit_sha: ${{ steps.create.outputs.deployment_commit_sha }}
      app_version: ${{ steps.create.outputs.app_version }}
      tag_object_sha: ${{ steps.create.outputs.tag_object_sha }}

    steps:
      - name: Create Litafi Deployment Tagger Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create Deployment Tag
        id: create
        uses: Litafi/.github/.github/actions/deployment-tag/create@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository }}
          version: ${{ inputs.version }}
          caller-ref: ${{ github.ref }}
          caller-sha: ${{ github.sha }}
